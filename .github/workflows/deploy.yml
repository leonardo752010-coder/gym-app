# Pubblica l'app su GitHub Pages a ogni modifica.
# Le icone vengono create qui dal logo (logo.b64, testo), così nel repository c'è solo testo.
# r/ = pagina per l'iPhone di lei (la chiave personale sta solo nel suo link, non qui).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepara i file e crea le icone dal logo
        run: |
          pip install pillow
          mkdir -p _site/r
          cp index.html manifest.webmanifest sw.js _site/
          cp r/index.html _site/r/
          python - <<'PY'
          import base64, io
          from PIL import Image
          # logo.b64 = logo rotondo (512x512, angoli trasparenti) salvato come testo
          badge = Image.open(io.BytesIO(base64.b64decode(open('logo.b64').read()))).convert('RGBA')
          BG = (22, 19, 14, 255)                       # stesso fondo scuro del logo
          def plain(size, name):                       # icona rotonda, angoli trasparenti
              badge.resize((size, size), Image.LANCZOS).save('_site/' + name)
          def tile(size, name, scale):                 # logo rotondo su fondo scuro (per Android e iPhone)
              t = Image.new('RGBA', (size, size), BG)
              s = int(size * scale)
              b = badge.resize((s, s), Image.LANCZOS)
              t.paste(b, ((size - s) // 2, (size - s) // 2), b)
              t.convert('RGB').save('_site/' + name)
          plain(192, 'icon-192.png')
          plain(512, 'icon-512.png')
          tile(512, 'icon-maskable-512.png', 0.80)
          tile(180, 'apple-touch-icon.png', 0.92)
          PY
          ls -la _site _site/r
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
